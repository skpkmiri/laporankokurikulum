<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi eKoku SKPK Miri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk terjemah JSX dalam Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print { 
            .print\:hidden { display: none !important; } 
            body { background: white !important; padding: 0 !important; margin: 0 !important; } 
            @page { size: A4 portrait; margin: 10mm; }
            .break-inside-avoid { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, updateDoc } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';

        const { useState, useMemo, useEffect, useRef } = React;

        // =====================================================================
        // KONFIGURASI PANGKALAN DATA FIREBASE (RASMI SKPK MIRI)
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDXh_xTy18MAeWNex2pAbxIU1GmPKFo2pg",
            authDomain: "ekoku-skpk-miri.firebaseapp.com",
            projectId: "ekoku-skpk-miri",
            storageBucket: "ekoku-skpk-miri.firebasestorage.app",
            messagingSenderId: "207059132138",
            appId: "1:207059132138:web:a36f8d2ce00d91806bc193",
            measurementId: "G-4FYQE25KRK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'ekoku-skpk-miri';

        // --- ICONS ---
        const Icons = {
            PenTool: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>,
            Archive: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>,
            PieChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>,
            Printer: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 0 20.49 15"></path></svg>
        };

        // --- UTILS ---
        const compressImage = (base64Str, maxWidth = 600) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = maxWidth / img.width;
                canvas.width = maxWidth;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            });
        };

        const parseCSV = (str) => {
            if (!str) return [];
            const arr = [];
            let quote = false;
            let row = 0, col = 0, c = 0;
            for (; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const fetchCSVData = async (rawUrl) => {
            if (!rawUrl) return null;
            const url = rawUrl.trim();
            const cacheBusterUrl = url.includes('?') ? `${url}&_t=${Date.now()}` : `${url}?_t=${Date.now()}`;
            
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                cacheBusterUrl,
                url
            ];

            for (let proxy of proxies) {
                try {
                const response = await fetch(proxy);
                if (response.ok) {
                    const text = await response.text();
                    const trimmed = text.trim().toLowerCase();
                    if (text && !trimmed.startsWith('<!doctype') && !trimmed.startsWith('<html')) {
                    return text;
                    }
                }
                } catch (err) {
                console.warn(`Fetch failed for proxy: ${proxy}`);
                }
            }
            throw new Error('Gagal muat turun data Google Sheets. Sila semak pautan anda.');
        };

        // --- MAIN COMPONENT ---
        function App() {
            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('laporan_baru');
            const [toastMessage, setToastMessage] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            const [reports, setReports] = useState([]);
            const [attendanceRecords, setAttendanceRecords] = useState([]);

            const DEFAULT_MURID_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyXz6iABc4zz0gpRMqo0xgzZtUmw9BSwkrbYq2Mc0c0hcnwg-pZTIm9XE1S2g5B_4wnblhRSAiO28V/pub?gid=0&single=true&output=csv';
            const DEFAULT_GURU_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyXz6iABc4zz0gpRMqo0xgzZtUmw9BSwkrbYq2Mc0c0hcnwg-pZTIm9XE1S2g5B_4wnblhRSAiO28V/pub?gid=33896881&single=true&output=csv';

            const [csvLinkMurid, setCsvLinkMurid] = useState(DEFAULT_MURID_CSV);
            const [csvLinkGuru, setCsvLinkGuru] = useState(DEFAULT_GURU_CSV);
            
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [activities, setActivities] = useState(['PILIH AKTIVITI']);

            useEffect(() => {
                const initAuth = async () => {
                try {
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("Auth Error:", error);
                    setToastMessage("Ralat: Sila aktifkan 'Anonymous Sign-in' di Firebase Console.");
                }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, u => { setUser(u); if (u) setIsLoading(false); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubReports = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), s => {
                    setReports(s.docs.map(d => ({ ...d.data(), id: d.id })).sort((a,b) => b.timestamp - a.timestamp));
                });
                const unsubAttendance = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'attendance'), s => {
                    setAttendanceRecords(s.docs.map(d => ({ ...d.data(), id: d.id })).sort((a,b) => b.timestamp - a.timestamp));
                });
                const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), d => {
                    if (d.exists()) {
                        const data = d.data();
                        if (data.csvLinkMurid) setCsvLinkMurid(data.csvLinkMurid);
                        if (data.csvLinkGuru) setCsvLinkGuru(data.csvLinkGuru);
                    }
                });
                return () => { unsubReports(); unsubAttendance(); unsubConfig(); };
            }, [user]);

            useEffect(() => {
                const fetchLiveCSV = async () => {
                    let newStudents = [];
                    let newTeachers = new Set();
                    let newActivities = new Set();
                    if (csvLinkMurid) {
                        try {
                            const text = await fetchCSVData(csvLinkMurid);
                            const rows = parseCSV(text);
                            for (let i = 1; i < rows.length; i++) {
                                const row = rows[i];
                                if (!row || row.length < 2) continue;
                                const name = (row[0] || '').trim();
                                const act1 = (row[1] || '').trim().toUpperCase();
                                const act2 = (row[2] || '').trim().toUpperCase();
                                const act3 = (row[3] || '').trim().toUpperCase();
                                if (name && name.toLowerCase() !== 'nama murid') {
                                    newStudents.push({ id: `S${i}`, name, act1, act2, act3 });
                                    if (act1 && act1 !== '-') newActivities.add(act1);
                                    if (act2 && act2 !== '-') newActivities.add(act2);
                                    if (act3 && act3 !== '-') newActivities.add(act3);
                                }
                            }
                            setStudents(newStudents.sort((a,b) => a.name.localeCompare(b.name)));
                            if (newActivities.size > 0) setActivities(Array.from(newActivities).sort());
                        } catch (e) { console.error(e); }
                    }
                    if (csvLinkGuru) {
                        try {
                            const text = await fetchCSVData(csvLinkGuru);
                            const rows = parseCSV(text);
                            for (let i = 1; i < rows.length; i++) {
                                const name = (rows[i]?.[0] || '').trim().toUpperCase();
                                if (name && name !== 'NAMA GURU') newTeachers.add(name);
                            }
                            setTeachers(Array.from(newTeachers).sort());
                        } catch (e) { console.error(e); }
                    }
                };
                fetchLiveCSV();
            }, [csvLinkMurid, csvLinkGuru]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3000); };

            const LaporanForm = () => {
                const [formData, setFormData] = useState({
                    perjumpaan: '1', unit: activities[0] || '', tarikh: '', tajuk: '', aktiviti: '', 
                    laporanMurid: null, rumusan: '', kemahiranBerfikir: '', 
                    kataKerjaKbat: '', ulasanKbat: '', disediakanOleh: '', namaDisediakan: '', 
                    ulasan1: '', ulasan2: '', ulasan3: '', ulasan4: '', ulasan5: '', ulasan6: '',
                    gambar1: null, gambar2: null, gambar3: null, gambar4: null, gambar5: null, gambar6: null
                });

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    if (!user) return;
                    try {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), {
                            ...formData, timestamp: Date.now(), createdBy: user.uid, eSignPenyemak: null
                        });
                        showToast('Laporan berjaya disimpan!');
                        setCurrentView('rekod_laporan');
                    } catch (err) { showToast('Ralat simpan data.'); }
                };

                const handleFile = async (e, field) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            const compressed = await compressImage(event.target.result);
                            setFormData(prev => ({ ...prev, [field]: compressed }));
                        };
                        reader.readAsDataURL(file);
                    }
                };

                return (
                    <div className="bg-white p-4 md:p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-xl font-bold mb-6 flex items-center gap-2"><Icons.PenTool /> Daftar Laporan Mingguan</h2>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Unit Kokurikulum</label>
                                    <select className="w-full p-3 border rounded-lg bg-white" value={formData.unit} onChange={e => setFormData({...formData, unit: e.target.value})}>
                                        {activities.map(act => <option key={act} value={act}>{act}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Tarikh</label>
                                    <input type="date" required className="w-full p-3 border rounded-lg bg-white" value={formData.tarikh} onChange={e => setFormData({...formData, tarikh: e.target.value})} />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Tajuk Aktiviti</label>
                                    <input type="text" required className="w-full p-3 border rounded-lg bg-white" value={formData.tajuk} onChange={e => setFormData({...formData, tajuk: e.target.value})} />
                                </div>
                            </div>
                            <textarea placeholder="Huraian Aktiviti..." required className="w-full p-3 border rounded-xl h-32" value={formData.aktiviti} onChange={e=>setFormData({...formData, aktiviti: e.target.value})} />
                            <textarea placeholder="Rumusan / Refleksi..." required className="w-full p-3 border rounded-xl h-24" value={formData.rumusan} onChange={e=>setFormData({...formData, rumusan: e.target.value})} />
                            
                            <div className="bg-slate-50 p-4 rounded-xl">
                                <h3 className="text-xs font-bold mb-4 uppercase">Pilih Gambar (Maks 6)</h3>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                    {[1,2,3,4,5,6].map(n => (
                                        <div key={n} className="flex flex-col gap-1">
                                            {formData[`gambar${n}`] ? <img src={formData[`gambar${n}`]} className="h-20 object-cover rounded" /> : 
                                            <input type="file" accept="image/*" onChange={e => handleFile(e, `gambar${n}`)} className="text-[10px]" />}
                                            <input type="text" placeholder="Ulasan..." className="p-1 border rounded text-[10px]" value={formData[`ulasan${n}`]} onChange={e=>setFormData({...formData, [`ulasan${n}`]: e.target.value})} />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-widest">Disediakan Oleh (Nama Guru)</label>
                                <select required className="w-full p-3 border rounded-xl bg-slate-50 font-bold uppercase text-xs" value={formData.namaDisediakan} onChange={e => setFormData({...formData, namaDisediakan: e.target.value, disediakanOleh: e.target.value})}>
                                    <option value="">SILA PILIH NAMA</option>
                                    {teachers.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>

                            <button type="submit" className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition uppercase tracking-widest">Simpan Laporan</button>
                        </form>
                    </div>
                );
            };

            const RekodLaporan = () => {
                const [selected, setSelected] = useState(null);
                const [isSigning, setIsSigning] = useState(false);
                const canvasRef = useRef(null);

                const saveSign = async () => {
                    const signData = canvasRef.current.toDataURL();
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', selected.id), { eSignPenyemak: signData });
                    setSelected({...selected, eSignPenyemak: signData});
                    setIsSigning(false);
                    showToast('Disemak!');
                };

                if (selected) return (
                    <div className="bg-white p-8 rounded-2xl border shadow-xl relative">
                        <button onClick={()=>setSelected(null)} className="mb-4 text-blue-600 font-bold print:hidden">&larr; KEMBALI</button>
                        <div className="text-center mb-6">
                            <h1 className="text-2xl font-bold uppercase underline">Laporan {selected.unit}</h1>
                            <p className="font-bold">TARIKH: {selected.tarikh}</p>
                        </div>
                        <div className="space-y-4 text-sm border-2 border-black p-4">
                            <p><strong>TAJUK:</strong> {selected.tajuk}</p>
                            <p><strong>AKTIVITI:</strong> {selected.aktiviti}</p>
                            <p><strong>RUMUSAN:</strong> {selected.rumusan}</p>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mt-6">
                            {[1,2,3,4,5,6].map(n => selected[`gambar${n}`] && (
                                <div key={n} className="border p-2 text-center">
                                    <img src={selected[`gambar${n}`]} className="h-32 mx-auto object-cover mb-1" />
                                    <p className="text-[10px] italic">{selected[`ulasan${n}`]}</p>
                                </div>
                            ))}
                        </div>
                        <div className="mt-12 flex justify-between px-10">
                            <div className="text-center">
                                <p className="text-xs uppercase font-bold">Disediakan oleh,</p>
                                <p className="mt-8 font-bold border-t-2 border-black pt-1">{selected.namaDisediakan}</p>
                            </div>
                            <div className="text-center">
                                <p className="text-xs uppercase font-bold">Disemak oleh,</p>
                                {selected.eSignPenyemak ? <img src={selected.eSignPenyemak} className="h-12 mx-auto" /> : 
                                <button onClick={()=>setIsSigning(true)} className="mt-2 bg-orange-500 text-white px-2 py-1 text-[10px] rounded print:hidden">Klik untuk E-Sign</button>}
                                <p className="mt-2 font-bold border-t-2 border-black pt-1">PENGURUSAN SEKOLAH</p>
                            </div>
                        </div>
                        <button onClick={()=>window.print()} className="mt-8 w-full py-2 bg-slate-800 text-white rounded font-bold print:hidden uppercase tracking-widest">Cetak PDF</button>
                        
                        {isSigning && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-xl w-full max-w-sm">
                                    <h3 className="font-bold mb-4">Tandatangan Penyemak</h3>
                                    <canvas ref={canvasRef} width="300" height="150" className="border-2 border-dashed bg-slate-50 w-full" />
                                    <div className="flex gap-2 mt-4">
                                        <button onClick={()=>setIsSigning(false)} className="flex-1 py-2 border rounded">Batal</button>
                                        <button onClick={saveSign} className="flex-1 py-2 bg-blue-600 text-white rounded">Simpan</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );

                return (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {reports.map(r => (
                            <div key={r.id} onClick={()=>setSelected(r)} className="p-4 bg-white border rounded-xl cursor-pointer hover:border-blue-500 transition shadow-sm">
                                <div className="text-[10px] font-bold text-blue-600">{r.unit} • {r.tarikh}</div>
                                <div className="font-bold text-slate-800 uppercase">{r.tajuk}</div>
                                <div className="text-[10px] text-slate-400 mt-2">Oleh: {r.namaDisediakan}</div>
                            </div>
                        ))}
                    </div>
                );
            };

            const KehadiranForm = () => {
                const [tarikh, setTarikh] = useState('');
                const [aktiviti, setAktiviti] = useState(activities[0] || '');
                const [kehadiran, setKehadiran] = useState({});

                const filtered = useMemo(() => {
                    const act = aktiviti?.toUpperCase();
                    return students.filter(s => s.act1 === act || s.act2 === act || s.act3 === act);
                }, [students, aktiviti]);

                useEffect(() => { 
                    const initial = {}; 
                    filtered.forEach(s => initial[s.id] = true); 
                    setKehadiran(initial);
                }, [filtered]);

                const handleSubmit = async () => {
                    if (!tarikh) return showToast('Pilih tarikh.');
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'attendance'), { 
                        tarikh, aktiviti, records: kehadiran, timestamp: Date.now(), createdBy: user.uid 
                    });
                    showToast('Berjaya!'); setCurrentView('rekod_kehadiran');
                };

                return (
                    <div className="bg-white p-6 rounded-2xl border shadow-sm">
                        <h2 className="text-xl font-bold mb-6">Ambil Kehadiran</h2>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <input type="date" className="p-3 border rounded-xl" value={tarikh} onChange={e=>setTarikh(e.target.value)} />
                            <select className="p-3 border rounded-xl bg-slate-50 font-bold" value={aktiviti} onChange={e=>setAktiviti(e.target.value)}>
                                {activities.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                        </div>
                        <div className="space-y-2">
                            {filtered.map(s => (
                                <div key={s.id} onClick={()=>setKehadiran({...kehadiran, [s.id]: !kehadiran[s.id]})} className={`p-4 border rounded-xl flex justify-between items-center cursor-pointer transition ${kehadiran[s.id] ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                    <span className="font-bold uppercase text-xs">{s.name}</span>
                                    {kehadiran[s.id] ? <span className="bg-green-500 text-white px-2 py-1 rounded text-[10px]">HADIR</span> : <span className="bg-red-500 text-white px-2 py-1 rounded text-[10px]">TH</span>}
                                </div>
                            ))}
                        </div>
                        <button onClick={handleSubmit} className="mt-8 w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg uppercase tracking-widest">Simpan Kehadiran</button>
                    </div>
                );
            };

            const TetapanData = () => {
                const [links, setLinks] = useState({ murid: csvLinkMurid, guru: csvLinkGuru });
                const handleSave = async () => {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { csvLinkMurid: links.murid, csvLinkGuru: links.guru });
                    showToast('Tetapan dikemaskini!');
                };
                return (
                    <div className="bg-white p-6 border rounded-2xl shadow-sm space-y-6">
                        <h2 className="text-xl font-bold">Tetapan Pautan Google Sheets</h2>
                        <input className="w-full p-3 border rounded-xl text-xs" placeholder="Pautan CSV Murid..." value={links.murid} onChange={e=>setLinks({...links, murid: e.target.value})} />
                        <input className="w-full p-3 border rounded-xl text-xs" placeholder="Pautan CSV Guru..." value={links.guru} onChange={e=>setLinks({...links, guru: e.target.value})} />
                        <button onClick={handleSave} className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold uppercase tracking-widest">Simpan & Kemaskini Data</button>
                    </div>
                );
            };

            if (isLoading) return <div className="h-screen flex flex-col items-center justify-center bg-slate-900 text-white font-bold animate-pulse tracking-widest"><div className="text-4xl mb-4">🚀</div>MEMUAT eKOKU LIVE...</div>;

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    {toastMessage && <div className="fixed top-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-50 font-bold text-xs">{toastMessage}</div>}
                    <header className="bg-slate-900 text-white print:hidden">
                        <div className="px-6 py-4 flex justify-between items-center border-b border-slate-800">
                            <div>
                                <h1 className="text-xl font-black flex items-center gap-2"><Icons.Archive /> eKOKU <span className="text-[10px] bg-green-500 px-2 rounded-full">LIVE</span></h1>
                                <p className="text-[9px] font-bold opacity-50 tracking-widest">SKPK MIRI</p>
                            </div>
                        </div>
                        <nav className="p-2 grid grid-cols-3 md:grid-cols-6 gap-1 bg-slate-800/50">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex flex-col items-center p-2 rounded-lg transition ${currentView === item.id ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-700'}`}>
                                    <item.icon /><span className="text-[9px] mt-1 font-bold uppercase">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </header>
                    <main className="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
                        {currentView === 'laporan_baru' && <LaporanForm />}
                        {currentView === 'rekod_laporan' && <RekodLaporan />}
                        {currentView === 'kehadiran_baru' && <KehadiranForm />}
                        {currentView === 'rekod_kehadiran' && <div className="space-y-4">{attendanceRecords.map(r=>(<div key={r.id} className="p-4 bg-white border rounded-xl flex justify-between items-center shadow-sm"><div><p className="font-bold text-xs uppercase">{r.aktiviti}</p><p className="text-[10px] text-slate-400">{r.tarikh}</p></div><Icons.ClipboardList /></div>))}</div>}
                        {currentView === 'rumusan' && <div className="p-10 text-center bg-white border rounded-2xl italic text-slate-400">Analisis Kehadiran Berfungsi Secara Automatik mengikut unit yang dipilih di tab kehadiran.</div>}
                        {currentView === 'tetapan' && <TetapanData />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
